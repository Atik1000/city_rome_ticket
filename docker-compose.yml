services:
  migrate:
    build:
      context: .
      args: { APP: admin }
    restart: "no"
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
    volumes:
      - ./data:/app/data
    command: sh -c "pnpm --filter @iconic/db db:push && pnpm --filter @iconic/db db:seed"

  admin:
    build:
      context: .
      args: { APP: admin }
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      UPLOADS_DIR: "/app/data/uploads"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      args: { APP: web }
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      UPLOADS_DIR: "/app/data/uploads"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
